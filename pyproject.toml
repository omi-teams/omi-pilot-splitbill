[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "split-bill"
version = "0.1.0"
description = "Split a restaurant bill: equal, tip, rounding and shares."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
split-bill = "split_bill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
